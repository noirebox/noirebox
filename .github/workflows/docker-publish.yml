name: Docker publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  # Rebuild hebdomadaire : une base Docker vieillit — les patchs Debian et pip
  # en amont ne s'appliquent qu'en reconstruisant. L'anti-fake s'applique aussi
  # à la sécurité : on re-scanne, on ne promet pas.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
