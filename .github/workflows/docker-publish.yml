name: Docker publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  # Rebuild hebdomadaire : une base Docker vieillit — les patchs Debian et pip
  # en amont ne s'appliquent qu'en reconstruisant. L'anti-fake s'applique aussi
  # à la sécurité : on re-scanne, on ne promet pas.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Smoke test the pushed image (the healthcheck the HEALTHCHECK promises)
        run: |
          IMAGE="$(echo "${{ steps.meta.outputs.tags }}" | head -1)"
          docker run -d --rm --name nb-smoke -p 8768:8768 "$IMAGE"
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8768/health | grep -q '"status":"ok"'; then
              echo "smoke OK: /health answers on the published image"
              docker logs nb-smoke | tail -3
              docker stop nb-smoke
              exit 0
            fi
            sleep 2
          done
          echo "smoke FAILED: /health never answered" ; docker logs nb-smoke
          docker stop nb-smoke || true
          exit 1
