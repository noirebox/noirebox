name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt ruff
      - name: Lint (ruff)
        run: ruff check .
      - name: Retrain both language models (CI-proven reproducibility)
        run: |
          python ml/gen_dataset.py
          python ml/train.py
          python ml/gen_dataset_en.py
          python ml/train.py --lang en
        shell: bash
      - name: Full test suite
        run: pytest -q
        env:
          NOIREBOX_DB: /tmp/ci-noirebox.db
