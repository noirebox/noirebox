[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "noirebox"
version = "0.5.0"
description = "The flight data recorder for AI agents — hash-chained, signed journal with RFC 3161 anchoring and third-party-verifiable exports."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "NoireBox contributors" }]
keywords = [
    "ai-agents", "audit-trail", "tamper-evident", "rfc3161",
    "gdpr", "ai-act", "compliance", "llm", "guardrail",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Logging",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "cryptography>=42.0",
    "PyJWT>=2.8",
    "httpx>=0.27",
    "scikit-learn>=1.4",
    "joblib>=1.3",
]

[project.optional-dependencies]
# The DPO-ready PDF attestation is a convenience layered on the core:
# reportlab is the heaviest dependency, so it ships as an extra.
pdf = ["reportlab>=4.0"]
# The OpenTimestamps witness (ADR 009) shells out to the `ots` CLI.
ots = ["opentimestamps-client>=0.7"]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
noirebox = "noirebox.cli:main"

[project.urls]
Homepage = "https://github.com/slabbdev/noirebox"
Documentation = "https://github.com/slabbdev/noirebox#readme"

[tool.hatch.build.targets.wheel]
packages = ["noirebox"]

# Les micro-modèles embarquent dans le wheel : `pip install noirebox` donne
# un moteur ML fonctionnel, sans make train. Le dépôt cloné, lui, continue
# de les lire dans models/ (voir ml_guardrail._model_path).
[tool.hatch.build.targets.wheel.force-include]
"models/detector.joblib" = "noirebox/models/detector.joblib"
"models/detector_en.joblib" = "noirebox/models/detector_en.joblib"

[tool.hatch.build.targets.sdist]
include = [
    "noirebox", "models", "verifier", "tests", "docs",
    "README.md", "README.fr.md", "CHANGELOG.md", "Makefile", "requirements.txt",
]
