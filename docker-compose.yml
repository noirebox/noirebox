services:
  noirebox:
    build: .
    # NB-09 : l'API n'écoute que la boucle locale par défaut. L'exposer au
    # réseau est une décision explicite (0.0.0.0:8768:8768) qui s'accompagne
    # de NOIREBOX_CLIENTS — une instance ouverte sans auth est le mode démo
    # local, pas un service.
    ports:
      - "127.0.0.1:8768:8768"
    # NB-09 : volume nommé — les fichiers appartiennent à l'utilisateur du
    # conteneur (uid 10001, voir Dockerfile). Un bind mount ./data reste
    # possible : `sudo chown 10001 ./data` d'abord, sinon le journal ne
    # peut pas être créé.
    volumes:
      - noirebox-data:/srv/data
    environment:
      - NOIREBOX_DB=/srv/data/noirebox.db
      # Auth DÉSACTIVÉE sans clients configurés (le quickstart local). Sur
      # toute instance exposée au-delà de 127.0.0.1, le définir est le
      # minimum : NOIREBOX_CLIENTS=id:secret
    restart: unless-stopped

volumes:
  noirebox-data:
